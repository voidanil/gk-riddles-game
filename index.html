<!doctype html>
<html>
  <head>
    <title>Word Puzzle</title>
    <!-- <link href="../lib/bootstrap-3.3.7-dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <form id="wordPuzzle" method="post">
        <div id="displayPanel">
          <div class="displayHeader">
            <span>Solve the Puzzle</span>
            <label id="timer">⏱</label>
          </div>
          <h3 id="guessPlease"></h3>
        </div>
        <!-- <hr id="lineSeparator"/>  -->
        <input
          type="text"
          placeholder="Type Here"
          id="guesses"
          autocomplete="off"
        /><br />
        <span class="topic active" id="iq">IQ</span>
        <span class="topic" id="math">Math</span>
        <span class="topic" id="gk">GK</span>
        <!-- <span class="topic" id="geography">Geography</span>
					<span class="topic" id="history">History</span>
					<span class="topic" id="sports">Sport</span> --><br />
        <button class="controlbtn" type="submit" id="submitGuess">
          Submit
        </button>
        <button class="controlbtn" type="button" id="playGame">Play</button>
        <!-- form msut have onlyone btn -->
        <button class="controlbtn" type="button" id="skip">Skip</button><br />
        <button class="controlbtn" type="button" id="restart">
          Play Again
        </button>
        <!-- <button class="control"id="stop">stop</button> --><br />
        <label id="points">Points :</label>
      </form>
      <div id="scaleMeter"></div>
    </div>
    <script src="script.js" type="module"></script>
  </body>
</html>
